<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NodeAssure — Survey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .survey-wrap {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .survey-logo {
      height: 48px;
      width: auto;
      margin: 0 auto 36px;
      display: block;
    }

    .survey-title {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .survey-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 36px;
    }

    .survey-form {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .field label .req {
      color: var(--grad-start);
    }

    .field input[type="text"],
    .field input[type="email"] {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 15px;
      color: var(--text);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }

    .field input:focus {
      border-color: rgba(245,166,35,0.5);
      background: rgba(255,255,255,0.07);
    }

    .field input::placeholder { color: rgba(255,255,255,0.2); }

    .radio-group,
    .check-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option,
    .check-option {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: border-color 0.2s, background 0.2s;
      font-size: 14px;
      color: var(--text-muted);
    }

    .radio-option:hover,
    .check-option:hover {
      border-color: rgba(245,166,35,0.3);
      background: rgba(255,255,255,0.03);
      color: var(--text);
    }

    .radio-option input,
    .check-option input {
      accent-color: var(--grad-start);
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      cursor: pointer;
    }

    .radio-option:has(input:checked),
    .check-option:has(input:checked) {
      border-color: rgba(245,166,35,0.5);
      background: rgba(245,166,35,0.06);
      color: var(--text);
    }

    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 4px 0;
    }

    .survey-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn-back {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-back:hover {
      color: var(--text);
      border-color: rgba(255,255,255,0.2);
    }

    .btn-submit {
      flex: 2;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: linear-gradient(135deg, var(--grad-start), var(--grad-end));
      color: #fff;
      transition: opacity 0.2s, transform 0.2s;
    }

    .btn-submit:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .success-msg {
      text-align: center;
      padding: 48px 24px;
    }

    .success-msg .checkmark {
      width: 64px; height: 64px;
      background: rgba(62,207,142,0.1);
      border: 2px solid #3ecf8e;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      color: #3ecf8e;
    }

    .success-msg .checkmark svg { width: 28px; height: 28px; }
    .success-msg h3 { font-size: 22px; font-weight: 700; margin-bottom: 12px; }
    .success-msg p { color: var(--text-muted); font-size: 15px; }
  </style>
</head>
<body>
  <div class="survey-wrap">
    <a href="index.html">
      <img src="assets/logo-horiz-rev.png" alt="NodeAssure" class="survey-logo" />
    </a>

    <div id="formWrap">
      <h1 class="survey-title">Help Shape NodeAssure</h1>
      <p class="survey-subtitle">Takes 2 minutes. Your input directly influences what we build.</p>

      <form class="survey-form" id="surveyForm">

        <div class="field">
          <label>Are you a current or potential Blockware Client?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="entry.1147139943" value="Blockware Client" />
              Blockware Client
            </label>
            <label class="radio-option">
              <input type="radio" name="entry.1147139943" value="Potential Client" />
              Potential Client
            </label>
          </div>
        </div>

        <div class="field">
          <label>What state are your ASIC rigs hosted?</label>
          <input type="text" name="entry.2135207603" placeholder="e.g. Texas" />
        </div>

        <div class="field">
          <label>If you own ASIC rigs, do you currently carry insurance coverage?</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="entry.1834191171" value="Yes" />
              Yes
            </label>
            <label class="radio-option">
              <input type="radio" name="entry.1834191171" value="No" />
              No
            </label>
          </div>
        </div>

        <div class="field">
          <label>Which type of coverage matters most to you? <span style="color:var(--text-muted);font-weight:400">(select all that apply)</span></label>
          <div class="check-group">
            <label class="check-option">
              <input type="checkbox" name="entry.861048032" value="Extended Warranty" />
              Extended Warranty
            </label>
            <label class="check-option">
              <input type="checkbox" name="entry.861048032" value="Repair Hash Rate Replacement" />
              Repair Hash Rate Replacement
            </label>
            <label class="check-option">
              <input type="checkbox" name="entry.861048032" value="Catastrophic" />
              Catastrophic
            </label>
          </div>
        </div>

        <hr class="divider" />

        <div class="field">
          <label>Name <span class="req">*</span></label>
          <input type="text" name="entry.76587775" placeholder="Your full name" required />
        </div>

        <div class="field">
          <label>Email Address <span class="req">*</span></label>
          <input type="email" name="entry.865024774" placeholder="you@example.com" required />
        </div>

        <div class="field">
          <label>Contact Number or Telegram</label>
          <input type="text" name="entry.2102174067" placeholder="+1 555 000 0000 or @handle" />
        </div>

        <div class="survey-actions">
          <a href="index.html" class="btn-back">← Back</a>
          <button type="submit" class="btn-submit">Submit →</button>
        </div>

      </form>
    </div>

    <div class="success-msg" id="successMsg" hidden>
      <div class="checkmark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h3>Thanks for your response!</h3>
      <p>We'll be in touch soon.</p>
      <br />
      <a href="index.html" class="btn-back" style="display:inline-flex;max-width:200px;margin:0 auto">← Back to Home</a>
    </div>
  </div>

  <div class="orb orb--orange"></div>
  <div class="orb orb--blue"></div>
  <div class="orb orb--green"></div>

  <script>
    const form = document.getElementById('surveyForm');
    const formWrap = document.getElementById('formWrap');
    const successMsg = document.getElementById('successMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const data = new FormData(form);
      const encoded = new URLSearchParams();

      for (const [key, value] of data.entries()) {
        encoded.append(key, value);
      }

      try {
        await fetch(
          'https://docs.google.com/forms/d/e/1FAIpQLSfx03lSdL6lxy1ZBmkalL2JmHJubw3MqC0T7zjn_UDbohScnA/formResponse',
          { method: 'POST', body: encoded, mode: 'no-cors' }
        );
      } catch (_) {}

      formWrap.hidden = true;
      successMsg.hidden = false;
    });
  </script>
</body>
</html>
